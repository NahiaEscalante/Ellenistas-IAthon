<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Brasper IA · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@500;600;700;800&display=swap">
<style>
/* Layout: barra del presentador arriba; cada escena es una pantalla simulada completa
   (plataforma Brasper en claro, ARM en oscuro). Look fijo a propósito: no cambia con el tema del visor. */
:root {
  color-scheme: light;
  --f-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Marca Brasper (logo: cian → índigo) */
  --b-cyan: #00D3F2; --b-indigo: #4A52D8; --b-royal: #3446C4; --b-royal-2: #2B3AA8;
  --b-grad: linear-gradient(100deg, #00D9F5 0%, #2F8FEA 48%, #4A52D8 100%);
  /* Plataforma actual (claro) */
  --p-bg: #F3F5FA; --p-surface: #FFFFFF; --p-line: #E3E8F2; --p-head: #DFE8F8; --p-ink: #1B2242; --p-ink-2: #3C4566; --p-muted: #707A98; --p-chip: #F1F4FA;
  --p-ok-bg: #D8F3E2; --p-ok: #1B7F47; --p-warn-bg: #FFF1D6; --p-warn: #A06A00; --p-bad-bg: #FDE2E2; --p-bad: #B42323;
  /* ARM (oscuro) */
  --a-bg: #050918; --a-panel: #0C1330; --a-panel-2: #111A3D; --a-line: #213062; --a-ink: #E9EEFF; --a-ink-2: #C3CCEE; --a-muted: #8C98C6; --a-glow: #2BE4FF;
  --a-ok: #3DDC84; --a-warn: #F5B544; --a-bad: #FF6B6B;
  /* Colores de agentes y canales (validados para fondo oscuro) */
  --c1: #4C7DFF; --c2: #5FA80F; --c3: #E8559F; --c4: #C98200; --c5: #9B6BF5; --c6: #0B97B3;
  /* Barra del presentador */
  --bar-bg: #0A0F24; --bar-ink: #DCE3FF; --bar-muted: #8C96BD;
  --r-s: 8px; --r-m: 12px; --r-l: 18px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--p-bg); color: var(--p-ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--b-cyan); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ============ Barra del presentador ============ */
.pbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--bar-bg); color: var(--bar-ink); border-bottom: 1px solid #1B2347; flex-wrap: wrap; }
.pbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pbar .brand img { width: 26px; height: 26px; }
.pbar .brand b { font-family: var(--f-display); font-weight: 700; font-size: 14px; white-space: nowrap; }
.pbar .brand span { color: var(--bar-muted); font-size: 12px; white-space: nowrap; }
.ptabs { display: flex; gap: 4px; flex: 1; justify-content: center; flex-wrap: wrap; }
.ptab { background: transparent; border: 1px solid transparent; color: var(--bar-muted); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.ptab:hover { color: var(--bar-ink); background: #141B3A; }
.ptab[aria-selected="true"] { color: #fff; background: #18214A; border-color: #2B3874; }
.ptab .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #222C5C; font-size: 11px; font-family: var(--f-display); }
.ptab[aria-selected="true"] .n { background: var(--b-grad); color: #04102B; }
.sim-pill { font-size: 11px; color: #B7C2EE; border: 1px dashed #3A4780; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.stage { display: none; min-height: calc(100% - 50px); }
.stage.on { display: block; }

/* ============ Plataforma Brasper actual (réplica) ============ */
.bp { display: grid; grid-template-rows: auto 1fr; background: var(--p-bg); min-height: calc(100vh - var(--pbar, 53px)); }
.bp-top { display: flex; align-items: center; gap: 20px; padding: 10px 24px; background: #fff; border-bottom: 1px solid var(--p-line); box-shadow: 0 1px 0 rgba(20,30,70,.03); }
.wordmark { display: flex; align-items: center; gap: 8px; text-decoration: none; }
.wordmark img { width: 34px; height: 34px; }
.wordmark .wm { display: flex; flex-direction: column; line-height: 1; }
.wordmark .wm b { font-family: var(--f-body); font-style: italic; font-weight: 700; font-size: 21px; color: #1E3A8A; letter-spacing: -0.02em; background: linear-gradient(90deg, #1F4FBF, #2B3AA8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.wordmark .wm i { font-size: 11px; color: #2F6FE0; font-weight: 700; margin-left: 22px; margin-top: -1px; }
.crumb { font-size: 13px; color: var(--p-ink-2); font-weight: 500; }
.bp-top .sp { flex: 1; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #DDE6FA; color: var(--b-royal); font-weight: 700; font-size: 13px; }
.bell { width: 20px; height: 20px; color: var(--p-ink-2); }
.bp-body { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 0; min-height: 0; }
.bp-side { padding: 18px 6px 18px 10px; }
.bp-rail { position: sticky; top: 70px; display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 14px 0; border-radius: 14px; background: linear-gradient(180deg, #3A4CCB, #2D3CAF); box-shadow: 0 6px 18px rgba(52,70,196,.25); }
.bp-rail button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: #C9D2FF; display: grid; place-items: center; position: relative; }
.bp-rail button svg { width: 18px; height: 18px; }
.bp-rail button:hover { background: rgba(255,255,255,.12); color: #fff; }
.bp-rail button.on { background: rgba(255,255,255,.2); color: #fff; }
.bp-rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 44px; top: 50%; transform: translateY(-50%); background: #1B2242; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; white-space: nowrap; z-index: 5; }
.bp-rail hr { width: 26px; border: 0; border-top: 1px solid rgba(255,255,255,.18); margin: 6px 0; }
.bp-main { padding: 22px 28px 40px 18px; min-width: 0; }
.bp-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--b-royal); font-weight: 600; }
.bp-head h1 { font-family: var(--f-body); font-weight: 600; font-size: 22px; color: var(--p-ink); display: flex; align-items: center; gap: 10px; }
.live { font-size: 11px; font-weight: 600; color: var(--p-ok); background: var(--p-ok-bg); border: 1px solid #B8E8CB; padding: 2px 8px; border-radius: 999px; display: inline-flex; gap: 6px; align-items: center; }
.live::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.bp-head .sp { flex: 1; }
.btn { border: 1px solid var(--p-line); background: #fff; color: var(--b-royal); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--b-royal); border-color: var(--b-royal); color: #fff; }
.bp-filters { margin-top: 16px; background: #fff; border: 1px solid var(--p-line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--p-chip); border-radius: 9px; padding: 3px; }
.seg span { padding: 5px 10px; border-radius: 7px; font-size: 12px; color: var(--p-ink-2); font-weight: 500; }
.seg span.on { background: var(--b-royal); color: #fff; }
.date-strong { font-weight: 600; font-size: 14px; }
.date-strong small { display: block; font-weight: 400; font-size: 11px; color: var(--p-muted); }
.today { font-size: 10px; background: #E9F6CF; color: #4B6B00; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
.tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.tag { border: 1px solid var(--p-line); background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--p-ink-2); }
.search { margin-top: 14px; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--p-line); border-radius: 10px; padding: 9px 12px; max-width: 300px; color: var(--p-muted); font-size: 13px; }
.search svg { width: 15px; height: 15px; }
.tbl-wrap { margin-top: 16px; background: #fff; border: 1px solid var(--p-line); border-radius: 14px; overflow: auto; position: relative; }
table.bt { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
table.bt th { background: var(--p-head); color: #26315F; font-weight: 600; text-align: left; padding: 12px 12px; white-space: nowrap; font-size: 12px; position: sticky; top: 0; z-index: 1; }
table.bt th.dk { background: #1E3E8F; color: #fff; text-align: center; font-size: 10.5px; letter-spacing: .02em; text-transform: uppercase; }
table.bt th.dk2 { background: #173273; color: #fff; text-align: center; font-size: 10.5px; text-transform: uppercase; }
table.bt th.gr { background: #1C8A55; color: #fff; text-align: center; font-size: 10.5px; text-transform: uppercase; }
table.bt th.rpacol { background: linear-gradient(100deg, #0EB6D9, #4A52D8); color: #fff; text-align: center; font-size: 10.5px; text-transform: uppercase; }
table.bt td { padding: 11px 12px; border-top: 1px solid var(--p-line); white-space: nowrap; color: var(--p-ink-2); font-variant-numeric: tabular-nums; transition: background .3s, box-shadow .3s; }
table.bt td.r { text-align: right; } table.bt td.c { text-align: center; }
table.bt td.hl1 { background: #EEF4FF; font-weight: 600; color: var(--p-ink); text-align: right; }
table.bt td.hl2 { background: #E6F7EE; font-weight: 700; color: #14663A; text-align: right; }
table.bt td.strong { color: var(--p-ink); font-weight: 600; }
.code { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; color: var(--p-ink); }
.flag { width: 15px; height: 15px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
.st { display: inline-block; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; }
.st.ok { background: var(--p-ok-bg); color: var(--p-ok); }
.st.wait { background: #EEF1F8; color: var(--p-muted); }
.st.run { background: #DDF7FD; color: #04718A; }
.st.warn { background: var(--p-warn-bg); color: var(--p-warn); }
.st.bad { background: var(--p-bad-bg); color: var(--p-bad); }
.lnk { color: var(--b-royal); font-size: 11px; font-weight: 600; }
.pdfb { border: 1px solid #C9D6F5; color: var(--b-royal); background: #F4F7FF; border-radius: 7px; padding: 4px 8px; font-size: 11px; font-weight: 600; }
.datein { border: 1px solid var(--p-line); border-radius: 8px; padding: 5px 8px; font-size: 11px; color: var(--p-muted); display: inline-flex; gap: 6px; align-items: center; }
tr.reading td { background: #E6FBFF !important; box-shadow: inset 0 1px 0 #7FE6F7, inset 0 -1px 0 #7FE6F7; }
tr.reading td:first-child { box-shadow: inset 3px 0 0 var(--b-cyan), inset 0 1px 0 #7FE6F7, inset 0 -1px 0 #7FE6F7; }
td.grab { animation: grab .7s ease; }
@keyframes grab { 0% { box-shadow: inset 0 0 0 2px var(--b-cyan); background: #CFF6FD; } 100% { box-shadow: inset 0 0 0 0 transparent; } }
.pager { display: flex; justify-content: space-between; padding: 12px 4px; color: var(--p-muted); font-size: 12px; }

/* Lanzador del RPA (programa externo) */
.launcher { position: fixed; right: 24px; bottom: 24px; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 12px 18px 12px 12px; border-radius: 18px; border: 1px solid #2A3A78; background: radial-gradient(120% 140% at 0% 0%, #17306E 0%, #0B1230 60%); color: #fff; box-shadow: 0 18px 40px rgba(10,20,60,.35), 0 0 0 1px rgba(43,228,255,.15); text-align: left; }
.launcher:hover { transform: translateY(-2px); box-shadow: 0 22px 48px rgba(10,20,60,.45), 0 0 0 1px rgba(43,228,255,.4); }
.launcher .bot-ic { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; background: var(--b-grad); color: #04102B; position: relative; }
.launcher .bot-ic::after { content: ''; position: absolute; inset: -4px; border-radius: 16px; border: 2px solid rgba(43,228,255,.5); animation: ping 2s infinite; }
@keyframes ping { 0% { opacity: .9; transform: scale(.95); } 100% { opacity: 0; transform: scale(1.25); } }
.launcher b { display: block; font-family: var(--f-display); font-size: 15px; }
.launcher small { color: #9FB0E8; font-size: 12px; }
.launcher .go { margin-left: 8px; background: #fff; color: #0B1230; font-weight: 700; padding: 8px 12px; border-radius: 10px; font-size: 13px; }

/* ============ Escena RPA (split) ============ */
.rpa { display: grid; grid-template-columns: minmax(0, 1fr); min-height: calc(100vh - var(--pbar, 53px)); }
.rpa.active { grid-template-columns: minmax(0, 1.1fr) 296px minmax(0, 1fr); }
.rpa .col-bp { min-width: 0; border-right: 1px solid var(--p-line); }
.rpa.active { height: calc(100vh - var(--pbar, 53px)); grid-template-rows: minmax(0, 1fr); }
.rpa.active .col-bp { overflow: auto; }
.rpa.active .bp { min-height: 100%; }
.rpa.active .tags, .rpa.active .search, .rpa.active .bp-head .btn, .rpa.active .bp-filters .btn, .rpa.active .bp-filters .datein, .rpa.active .crumb { display: none; }
.rpa.active .bp-filters { margin-top: 10px; padding: 8px 10px; }
.rpa.active .tbl-wrap { margin-top: 10px; }
.rpa.active .col-target .browser { min-height: 0; }
.rpa.active .bp-main { padding: 16px 14px 24px 10px; }
.rpa.active .bp-body { grid-template-columns: 54px minmax(0,1fr); }
.rpa.active .bp-side { padding: 14px 4px 14px 8px; }
.rpa.active .bp-top { padding: 10px 14px; }
.col-bot, .col-target { display: none; min-width: 0; }
.rpa.active .col-bot, .rpa.active .col-target { display: flex; }

.col-bot { flex-direction: column; background: radial-gradient(130% 60% at 50% 0%, #142560 0%, #070C22 55%); color: var(--a-ink); border-right: 1px solid #1B2752; position: relative; overflow: hidden; }
.win-bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #1E2A55; font-size: 12px; color: var(--a-muted); }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: #2A355F; display: block; }
.dots i:nth-child(1) { background: #FF5F57; } .dots i:nth-child(2) { background: #FEBC2E; } .dots i:nth-child(3) { background: #28C840; }
.bot-head { padding: 14px 14px 10px; display: flex; gap: 12px; align-items: center; }
.bot-face { width: 44px; height: 44px; border-radius: 14px; background: var(--b-grad); display: grid; place-items: center; color: #04102B; flex: none; position: relative; }
.bot-face.busy::after { content: ''; position: absolute; inset: -5px; border-radius: 18px; border: 2px solid var(--a-glow); border-top-color: transparent; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.bot-head b { font-family: var(--f-display); font-size: 15px; display: block; }
.bot-state { font-size: 12px; color: var(--a-muted); display: flex; gap: 6px; align-items: center; }
.bot-state .led { width: 7px; height: 7px; border-radius: 50%; background: var(--a-muted); }
.bot-state.run .led { background: var(--a-glow); box-shadow: 0 0 8px var(--a-glow); }
.bot-state.done .led { background: var(--a-ok); }
.bot-ctrl { padding: 0 14px 12px; display: grid; gap: 10px; }
.run-btn { border: 0; border-radius: 11px; padding: 11px 12px; font-weight: 700; font-family: var(--f-display); background: var(--b-grad); color: #04102B; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
.run-btn:disabled { opacity: .55; cursor: default; }
.run-btn.ghost { background: transparent; color: var(--a-ink); border: 1px solid #2B3A70; font-family: var(--f-body); font-weight: 600; font-size: 13px; padding: 8px; }
.ctl-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 12px; color: var(--a-muted); }
.dseg { display: inline-flex; border: 1px solid #2B3A70; border-radius: 9px; padding: 2px; background: #0A1230; }
.dseg button { border: 0; background: transparent; color: var(--a-muted); font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 7px; }
.dseg button.on { background: #1D2B66; color: #fff; }
.bot-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #1C2850; border-top: 1px solid #1C2850; border-bottom: 1px solid #1C2850; }
.bot-kpis div { background: #0A1130; padding: 9px 10px; }
.bot-kpis b { display: block; font-family: var(--f-display); font-size: 17px; color: #fff; font-variant-numeric: tabular-nums; }
.bot-kpis span { font-size: 10.5px; color: var(--a-muted); }
.bot-scroll { flex: 1; overflow: auto; padding: 12px 14px 16px; display: grid; gap: 14px; align-content: start; }
.bsec h4 { font-family: var(--f-body); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--a-muted); font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
.cur-op { border: 1px solid #263670; border-radius: 12px; padding: 10px 12px; background: rgba(17,26,61,.7); }
.cur-op .rt { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--a-ink-2); margin-top: 4px; }
.cur-op b { font-family: var(--f-mono); font-size: 13px; color: #fff; }
.fields { display: grid; gap: 4px; }
.fld { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 12px; padding: 5px 8px; border-radius: 7px; background: rgba(255,255,255,.03); border: 1px solid transparent; transition: all .25s; }
.fld span { color: var(--a-muted); }
.fld code { font-family: var(--f-mono); font-size: 11.5px; color: var(--a-ink); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fld.got { border-color: #1E4D74; background: rgba(43,228,255,.06); }
.fld.put { border-color: #1F5A3E; background: rgba(61,220,132,.07); }
.fld.put code::after { content: ' ✓'; color: var(--a-ok); }
.rules { display: grid; gap: 6px; }
.rule { font-size: 12px; display: flex; gap: 8px; align-items: flex-start; color: var(--a-ink-2); }
.rule i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; flex: none; margin-top: 1px; background: #1C2850; color: var(--a-muted); }
.rule.ok i { background: rgba(61,220,132,.18); color: var(--a-ok); }
.rule.bad i { background: rgba(255,107,107,.2); color: var(--a-bad); }
.rule.bad { color: #FFD0D0; }
.log { font-family: var(--f-mono); font-size: 11px; line-height: 1.55; color: #9EB0E6; background: #050A1C; border: 1px solid #172246; border-radius: 10px; padding: 8px 10px; max-height: 190px; overflow: auto; }
.log p { margin: 0; }
.log .t { color: #56679E; }
.log .ok { color: var(--a-ok); } .log .ai { color: var(--a-glow); } .log .bad { color: var(--a-bad); } .log .warn { color: var(--a-warn); }
.queue { display: grid; gap: 4px; }
.q { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 5px 8px; border-radius: 7px; background: rgba(255,255,255,.03); }
.q code { font-family: var(--f-mono); color: var(--a-ink); font-size: 11.5px; }
.q .dest { color: var(--a-muted); flex: 1; font-size: 11px; }
.q .s { font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 5px; background: #1A2550; color: var(--a-muted); }
.q .s.run { background: rgba(43,228,255,.15); color: var(--a-glow); }
.q .s.ok { background: rgba(61,220,132,.15); color: var(--a-ok); }
.q .s.bad { background: rgba(255,107,107,.15); color: var(--a-bad); }

/* Ventana de la plataforma destino */
.col-target { flex-direction: column; background: #E9EDF5; padding: 14px; gap: 10px; }
.browser { flex: 1; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(20,30,70,.16); border: 1px solid #D6DCE8; min-height: 560px; position: relative; }
.bchrome { display: flex; align-items: center; gap: 10px; background: #DDE2EC; padding: 8px 10px 0; }
.btabs { display: flex; gap: 2px; }
.btab { padding: 7px 12px; border-radius: 9px 9px 0 0; font-size: 12px; color: #4C5677; display: flex; align-items: center; gap: 6px; background: transparent; border: 0; }
.btab.on { background: #fff; color: #1B2242; font-weight: 600; }
.btab .fav { width: 14px; height: 14px; border-radius: 4px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #fff; }
.baddr { display: flex; align-items: center; gap: 8px; padding: 7px 12px; background: #fff; border-bottom: 1px solid #E3E7EF; font-size: 12px; color: #5A6585; }
.baddr .pill { flex: 1; background: #F1F3F8; border-radius: 999px; padding: 5px 12px; font-family: var(--f-mono); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bview { flex: 1; overflow: auto; position: relative; }
.sim-mark { position: absolute; right: 10px; bottom: 8px; font-size: 10px; color: #8A93AE; background: rgba(255,255,255,.85); padding: 2px 6px; border-radius: 5px; z-index: 3; pointer-events: none; }
.vcursor { position: absolute; left: 50%; top: 40%; width: 22px; height: 22px; z-index: 6; pointer-events: none; transition: left .45s cubic-bezier(.4,.1,.2,1), top .45s cubic-bezier(.4,.1,.2,1); filter: drop-shadow(0 2px 3px rgba(0,0,0,.3)); }
.vcursor.press { transform: scale(.85); }
.target-hint { font-size: 12px; color: #5A6585; display: flex; gap: 8px; align-items: center; }
.target-hint b { color: #1B2242; }

/* KeyFácil simulado */
.kf { min-height: 100%; background: #F4F5FB; font-family: var(--f-body); }
.kf-top { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: linear-gradient(90deg, #4B3BD6, #3D7BF2); color: #fff; }
.kf-logo { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 15px; letter-spacing: .02em; }
.kf-logo i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #FF8A3D, #F2435A); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.kf-top .sp { flex: 1; }
.kf-top small { opacity: .85; font-size: 11px; }
.kf-body { padding: 14px 16px 20px; }
.kf-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.kf-title h3 { font-family: var(--f-body); font-size: 16px; color: #2A2560; }
.frm { display: grid; gap: 10px; }
.fsec { background: #fff; border: 1px solid #E4E6F2; border-radius: 10px; padding: 10px 12px; }
.fsec h5 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: #6A6F96; font-weight: 700; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
.fgrid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.fgrid.c1 { grid-template-columns: minmax(0, 1fr); }
.ff { display: grid; gap: 3px; min-width: 0; }
.ff.w2 { grid-column: span 2; }
.ff label { font-size: 10.5px; color: #6A7090; font-weight: 600; }
.ff input { width: 100%; border: 1px solid #DADDEB; border-radius: 7px; padding: 6px 8px; font-size: 12px; color: #1B2242; background: #FBFBFE; font-variant-numeric: tabular-nums; transition: box-shadow .2s, border-color .2s, background .2s; min-width: 0; }
.ff input.focus { border-color: #20C3E8; box-shadow: 0 0 0 3px rgba(32,195,232,.25); background: #fff; }
.ff input.filled { background: #F3FBFE; }
.kf-btn { border: 0; border-radius: 9px; padding: 9px 16px; font-weight: 700; color: #fff; background: linear-gradient(90deg, #FF7A3D, #F2435A); font-size: 13px; }
.om-btn { border: 0; border-radius: 9px; padding: 9px 16px; font-weight: 700; color: #06302C; background: #2EE6C9; font-size: 13px; }
.btn-press { transform: scale(.95); filter: brightness(.92); }
.frm-foot { display: flex; justify-content: flex-end; gap: 8px; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%) translateY(-20px); opacity: 0; transition: all .35s; z-index: 7; background: #0F5132; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 12.5px; font-weight: 600; box-shadow: 0 10px 24px rgba(0,0,0,.2); display: flex; gap: 8px; align-items: center; white-space: nowrap; max-width: 92%; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.bad { background: #8A1C1C; }
.toast.info { background: #12306E; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; display: inline-block; }
/* Omie simulado */
.om { min-height: 100%; background: #F2F6F7; font-family: var(--f-body); }
.om-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #0D2A36; color: #CFF7F1; }
.om-logo { font-family: var(--f-display); font-weight: 700; font-size: 18px; color: #2EE6C9; letter-spacing: -.02em; }
.om-top .sp { flex: 1; }
.om-top small { font-size: 11px; color: #8FC9C2; }
.om-sub { display: flex; gap: 14px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #DCE6E8; font-size: 12px; color: #48606A; }
.om-sub b { color: #0D2A36; }
.om .fsec { border-color: #DCE6E8; }
.om .fsec h5 { color: #3F6B73; }
.om .ff input { border-color: #CFDCDF; background: #FAFCFC; }
/* Escaneo de visión (diseño cambiado) */
.vbox { position: absolute; border: 1.5px solid #20C3E8; border-radius: 6px; background: rgba(32,195,232,.08); z-index: 5; pointer-events: none; animation: vb .35s ease both; }
.vbox span { position: absolute; left: -1px; top: -17px; background: #20C3E8; color: #03252E; font-family: var(--f-mono); font-size: 9.5px; padding: 1px 5px; border-radius: 4px 4px 4px 0; white-space: nowrap; }
@keyframes vb { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
.scanline { position: absolute; left: 0; right: 0; height: 60px; z-index: 5; pointer-events: none; background: linear-gradient(180deg, transparent, rgba(32,195,232,.25), transparent); border-bottom: 2px solid rgba(32,195,232,.8); animation: scan 1.3s ease-in-out; }
@keyframes scan { from { top: -60px; } to { top: 100%; } }

/* Paquete de datos volando */
.packet { position: fixed; z-index: 100; pointer-events: none; font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; color: #03252E; background: linear-gradient(90deg, #7FF0FF, #B9C2FF); padding: 4px 9px; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.6), 0 0 18px rgba(43,228,255,.7); white-space: nowrap; transform: translate(-50%, -50%); }

/* ============ Nueva web Brasper (dic 2026) ============ */
.nw { min-height: calc(100vh - var(--pbar, 53px)); background: #F6F8FD; display: grid; grid-template-columns: 236px minmax(0, 1fr); }
.nw-side { background: #fff; border-right: 1px solid #E6EAF4; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; }
.nw-side .wordmark { margin: 0 6px 18px; }
.nw-nav { border: 0; background: transparent; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: #4A5375; font-weight: 500; font-size: 13.5px; text-align: left; }
.nw-nav svg { width: 17px; height: 17px; flex: none; }
.nw-nav:hover { background: #F1F4FB; }
.nw-nav.on { background: #EEF2FF; color: var(--b-royal); font-weight: 600; }
.nw-group { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #9AA2BE; margin: 14px 10px 4px; font-weight: 600; }
.arm-cta { margin-top: 10px; position: relative; border: 0; padding: 0; border-radius: 14px; background: conic-gradient(from var(--ang, 0deg), #00D9F5, #4A52D8, #B36BFF, #00D9F5); animation: rot 4s linear infinite; }
@property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes rot { to { --ang: 360deg; } }
.arm-cta > span { margin: 2px; display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 12px; background: radial-gradient(120% 160% at 0% 0%, #1A2C72, #070C24 70%); color: #fff; text-align: left; }
.arm-cta b { font-family: var(--f-display); font-size: 14px; display: block; }
.arm-cta small { font-size: 11px; color: #A9B6EA; }
.orb { width: 34px; height: 34px; border-radius: 50%; flex: none; position: relative; background: radial-gradient(circle at 35% 30%, #E8FDFF 0%, #5BE8FF 22%, #4A52D8 62%, #2A1C7A 100%); box-shadow: 0 0 18px rgba(43,228,255,.55); }
.orb::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid rgba(91,232,255,.6); animation: ping 2.2s infinite; }
.nw-main { padding: 22px 28px 40px; min-width: 0; display: grid; gap: 18px; align-content: start; }
.nw-topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.nw-topbar h1 { font-family: var(--f-display); font-size: 22px; font-weight: 700; color: #141B3D; }
.nw-topbar p { margin: 2px 0 0; color: #6A7395; font-size: 13px; }
.nw-topbar .sp { flex: 1; }
.viewsw { display: inline-flex; background: #fff; border: 1px solid #E1E6F2; border-radius: 11px; padding: 3px; }
.viewsw button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: #5A6385; }
.viewsw button.on { background: #141B3D; color: #fff; }
.ai-pill { border: 0; position: relative; padding: 0; border-radius: 999px; background: conic-gradient(from var(--ang, 0deg), #00D9F5, #4A52D8, #B36BFF, #00D9F5); animation: rot 4s linear infinite; box-shadow: 0 6px 20px rgba(74,82,216,.35); }
.ai-pill span { display: flex; align-items: center; gap: 8px; margin: 2px; padding: 8px 16px 8px 8px; border-radius: 999px; background: #0B1233; color: #fff; font-weight: 700; font-family: var(--f-display); font-size: 13.5px; }
.ai-pill .orb { width: 24px; height: 24px; }
.hero-arm { position: relative; overflow: hidden; border-radius: 20px; padding: 26px 28px; color: #fff; background: radial-gradient(80% 140% at 100% 0%, #3B2A9E 0%, transparent 55%), radial-gradient(90% 120% at 0% 100%, #0C6E9A 0%, transparent 55%), #081033; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: center; }
.hero-arm h2 { font-size: 26px; font-weight: 700; line-height: 1.15; }
.hero-arm h2 em { font-style: normal; background: linear-gradient(90deg, #7FF0FF, #B9A8FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-arm p { color: #B8C4F0; max-width: 52ch; margin: 10px 0 16px; font-size: 14px; }
.hero-arm .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.hero-arm .chips span { font-size: 11.5px; padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); color: #D9E1FF; background: rgba(255,255,255,.04); display: inline-flex; align-items: center; gap: 6px; }
.hero-arm .chips i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.go-arm { border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; font-family: var(--f-display); background: linear-gradient(90deg, #5BE8FF, #8F8BFF); color: #070C24; font-size: 14px; display: inline-flex; gap: 10px; align-items: center; box-shadow: 0 0 24px rgba(91,232,255,.35); }
.mini-const { position: relative; aspect-ratio: 1.3; max-width: 100%; }
.mini-const canvas { width: 100%; height: 100%; display: block; }
.kpis4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kcard { background: #fff; border: 1px solid #E6EAF4; border-radius: 14px; padding: 14px 16px; }
.kcard span { font-size: 12px; color: #6A7395; }
.kcard b { display: block; font-family: var(--f-display); font-size: 22px; color: #141B3D; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kcard small { font-size: 11.5px; color: var(--p-ok); font-weight: 600; }
.panel { background: #fff; border: 1px solid #E6EAF4; border-radius: 16px; padding: 16px 18px; min-width: 0; }
.panel h3 { font-family: var(--f-display); font-size: 15px; font-weight: 600; color: #141B3D; display: flex; align-items: center; gap: 8px; }
.panel h3 .ai-tag { font-family: var(--f-body); font-size: 10.5px; font-weight: 700; color: #4A52D8; background: #EEF0FF; padding: 2px 7px; border-radius: 999px; }
.panel .sub { color: #6A7395; font-size: 12.5px; margin: 4px 0 12px; }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.src i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.nw-grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; }

/* Web pública (calculadora) */
.pub { border-radius: 20px; overflow: hidden; border: 1px solid #E1E6F2; background: #fff; }
.pub-nav { display: flex; align-items: center; gap: 18px; padding: 12px 22px; border-bottom: 1px solid #EEF1F7; font-size: 13px; color: #4A5375; flex-wrap: wrap; }
.pub-nav .sp { flex: 1; }
.pub-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 28px; padding: 30px 28px; background: radial-gradient(70% 120% at 100% 0%, #E2F8FF 0%, transparent 60%), radial-gradient(60% 100% at 0% 100%, #EEEAFF 0%, transparent 60%), #fff; align-items: center; }
.pub-hero h2 { font-size: 30px; line-height: 1.12; color: #101845; font-weight: 800; }
.pub-hero h2 em { font-style: normal; background: var(--b-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pub-hero p { color: #5A6385; font-size: 15px; max-width: 46ch; }
.trust { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 16px; font-size: 12.5px; color: #4A5375; }
.trust b { font-family: var(--f-display); color: #101845; font-size: 16px; display: block; }
.calc { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 18px 44px rgba(30,50,120,.14); border: 1px solid #E6EAF4; display: grid; gap: 12px; }
.calc .dir { display: grid; grid-template-columns: 1fr 1fr; background: #F1F4FB; border-radius: 11px; padding: 3px; }
.calc .dir button { border: 0; background: transparent; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 13px; color: #5A6385; }
.calc .dir button.on { background: #fff; color: #141B3D; box-shadow: 0 2px 6px rgba(20,30,70,.08); }
.amt { border: 1px solid #DDE3F0; border-radius: 12px; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; align-items: center; }
.amt label { font-size: 11.5px; color: #6A7395; grid-column: 1 / -1; }
.amt input { border: 0; font-family: var(--f-display); font-size: 22px; font-weight: 700; color: #101845; width: 100%; background: transparent; padding: 0; min-width: 0; }
.amt input:focus { outline: none; }
.amt .cur { font-weight: 700; font-size: 13px; color: #141B3D; background: #F1F4FB; border-radius: 8px; padding: 5px 9px; }
.calc-lines { display: grid; gap: 4px; font-size: 12.5px; color: #5A6385; padding: 0 4px; }
.calc-lines div { display: flex; justify-content: space-between; }
.calc-lines b { color: #141B3D; font-variant-numeric: tabular-nums; }
.calc .cta { border: 0; border-radius: 12px; padding: 12px; font-weight: 700; font-family: var(--f-display); background: var(--b-grad); color: #fff; font-size: 15px; }
.track { background: #070C24; color: #C9D3F7; border-radius: 16px; padding: 14px 16px; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.6; min-width: 0; }
.track h4 { font-family: var(--f-body); color: #fff; font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.track .k { color: #7F8DC2; } .track .v { color: #7FF0FF; word-break: break-all; }
.track .ev { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #24305E; }
.track .ev p { margin: 2px 0; }
.track .ok { color: var(--a-ok); }
.visit-src { display: flex; gap: 6px; flex-wrap: wrap; }
.visit-src button { border: 1px solid #DDE3F0; background: #fff; border-radius: 999px; padding: 5px 11px; font-size: 12px; color: #4A5375; font-weight: 600; }
.visit-src button.on { border-color: #141B3D; background: #141B3D; color: #fff; }

/* ============ ARM · un mundo nuevo (claro, luminoso, vidrio) ============ */
.arm {
  --a-bg: #F3F5FF; --a-panel: rgba(255,255,255,.62); --a-panel-2: rgba(255,255,255,.88); --a-line: rgba(112,124,214,.22);
  --a-ink: #121637; --a-ink-2: #3A4170; --a-muted: #6B739F; --a-glow: #06B6D4; --a-violet: #7C5CFF;
  --a-ok: #12A150; --a-warn: #D97706; --a-bad: #E11D48;
  --ch-track: rgba(110,120,200,.12); --ch-ring: #FFFFFF; --ch-grid: rgba(110,120,200,.16);
  --grad: linear-gradient(110deg, #00BCEB 0%, #5468FF 52%, #A855F7 100%);
  --glass: rgba(255,255,255,.6); --glass-b: rgba(255,255,255,.85);
  --sh: 0 1px 0 rgba(255,255,255,.9) inset, 0 14px 36px rgba(70,80,170,.12);
  color-scheme: light; background: var(--a-bg); color: var(--a-ink); min-height: calc(100vh - var(--pbar, 53px)); display: grid; grid-template-rows: auto 1fr; position: relative; isolation: isolate;
}
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, #F1F3FF 45%, #EAEFFF 100%); }
.aurora i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 22s ease-in-out infinite alternate; }
.aurora .b1 { width: 46vw; height: 46vw; left: -10vw; top: -14vw; background: #8BE7FF; }
.aurora .b2 { width: 40vw; height: 40vw; right: -8vw; top: -6vw; background: #C2B0FF; animation-delay: -6s; }
.aurora .b3 { width: 36vw; height: 36vw; left: 30vw; bottom: -18vw; background: #FFB8E2; opacity: .4; animation-delay: -12s; }
.aurora .b4 { width: 26vw; height: 26vw; right: 12vw; bottom: 4vw; background: #9FF3D3; opacity: .35; animation-delay: -3s; }
@keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(4vw, 3vw) scale(1.12); } }
.aurora .floor { position: absolute; left: -20%; right: -20%; bottom: -10%; height: 48%; background-image: linear-gradient(rgba(84,104,255,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(84,104,255,.16) 1px, transparent 1px); background-size: 56px 56px; transform: perspective(520px) rotateX(62deg); transform-origin: bottom; -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 85%); mask-image: linear-gradient(to top, #000 0%, transparent 85%); }
.aurora .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(84,104,255,.18) 1px, transparent 1.4px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(70% 60% at 50% 30%, #000, transparent); mask-image: radial-gradient(70% 60% at 50% 30%, #000, transparent); }

.arm-top { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 24px; background: rgba(255,255,255,.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--a-line); flex-wrap: wrap; }
.arm-logo { display: flex; align-items: center; gap: 10px; }
.arm-logo img { width: 32px; height: 32px; }
.arm-logo b { font-family: var(--f-display); font-size: 19px; letter-spacing: -.01em; color: var(--a-ink); }
.arm-logo b em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.arm-top .sp { flex: 1; }
.agents-on { font-size: 12.5px; color: var(--a-ink-2); display: flex; align-items: center; gap: 8px; background: var(--glass-b); border: 1px solid var(--a-line); padding: 6px 12px; border-radius: 999px; }
.agents-on i { width: 8px; height: 8px; border-radius: 50%; background: var(--a-ok); box-shadow: 0 0 0 4px rgba(18,161,80,.15); }
.back-btn { border: 1px solid var(--a-line); background: var(--glass-b); color: var(--a-ink-2); padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.back-btn:hover { background: #fff; }
.arm-body { position: relative; display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 0; }
.arm-rail { padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
.arm-rail .grp { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--a-muted); margin: 14px 10px 6px; font-weight: 700; }
.rail-btn { border: 1px solid transparent; background: transparent; color: var(--a-ink-2); display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 14px; font-size: 13.5px; font-weight: 600; text-align: left; }
.rail-btn:hover { background: rgba(255,255,255,.6); }
.rail-btn.on { background: #fff; color: var(--a-ink); border-color: var(--a-line); box-shadow: 0 6px 18px rgba(70,80,170,.10); }
.rail-btn svg { width: 17px; height: 17px; flex: none; color: var(--a-muted); }
.rail-btn .mascot { flex: none; }
.arm-main { min-width: 0; padding: 22px 28px 48px 10px; display: grid; gap: 20px; align-content: start; }
.rise { animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, 0s); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.hello h2 { font-size: clamp(26px, 3vw, 38px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.hello h2 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hello p { margin: 6px 0 0; color: var(--a-muted); font-size: 15px; }
.glass { background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); border: 1px solid rgba(255,255,255,.75); box-shadow: var(--sh); }

/* Constelación */
.const { position: relative; border-radius: 28px; overflow: hidden; height: 560px; background: radial-gradient(42% 52% at 50% 50%, rgba(124,92,255,.16), transparent 70%), radial-gradient(30% 40% at 50% 50%, rgba(0,188,235,.14), transparent 70%), rgba(255,255,255,.45); border: 1px solid rgba(255,255,255,.8); box-shadow: var(--sh); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.const canvas.links { position: absolute; inset: 0; width: 100%; height: 100%; }
.core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 164px; height: 164px; border-radius: 50%; display: grid; place-items: center; text-align: center; z-index: 2; background: radial-gradient(circle at 35% 28%, #FFFFFF 0%, #9CF1FF 16%, #5468FF 58%, #7B2FF7 100%); box-shadow: 0 0 0 10px rgba(255,255,255,.55), 0 20px 60px rgba(84,104,255,.45), 0 0 90px rgba(0,188,235,.35); }
.core::before, .core::after { content: ''; position: absolute; inset: -22px; border-radius: 50%; border: 1.5px solid rgba(84,104,255,.35); animation: ping 3s infinite; }
.core::after { animation-delay: 1.5s; }
.core canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
.core b { position: relative; font-family: var(--f-display); font-size: 17px; color: #fff; text-shadow: 0 2px 10px rgba(30,20,120,.4); }
.core small { position: relative; display: block; font-size: 11px; color: #EEF1FF; }
.anode { position: absolute; transform: translate(-50%, -50%); z-index: 3; width: 222px; border-radius: 22px; padding: 10px 12px 10px 8px; text-align: left; color: var(--a-ink); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 8px; align-items: center; background: rgba(255,255,255,.72); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 10px 28px rgba(70,80,170,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .25s, box-shadow .25s; }
.anode:hover { transform: translate(-50%, -54%) scale(1.03); box-shadow: 0 18px 40px color-mix(in srgb, var(--ac) 35%, transparent), 0 0 0 2px var(--ac); }
.anode .mascot { grid-row: span 2; margin: -26px -2px -14px -8px; }
.anode b { font-family: var(--f-display); font-size: 15px; display: block; }
.anode .role { font-size: 11.5px; color: var(--a-muted); }
.anode .live2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--a-ink-2); background: color-mix(in srgb, var(--ac) 10%, #fff); border-radius: 999px; padding: 4px 9px; margin-top: 2px; }
.anode .live2 i { width: 6px; height: 6px; border-radius: 50%; background: var(--ac); flex: none; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.srcs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.srcs span { font-size: 11.5px; color: var(--a-ink-2); background: var(--glass-b); border: 1px solid var(--a-line); border-radius: 999px; padding: 5px 11px; display: inline-flex; align-items: center; gap: 6px; }
.srcs span i { width: 6px; height: 6px; border-radius: 50%; background: var(--grad); display: block; }

.ask { border-radius: 24px; padding: 14px; display: grid; gap: 10px; }
.ask-row { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--a-line); border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: 0 6px 18px rgba(70,80,170,.08); }
.ask-row input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--a-ink); font-size: 15px; padding: 8px 0; }
.ask-row input:focus { outline: none; }
.ask-row button { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; background: var(--grad); color: #fff; box-shadow: 0 8px 20px rgba(84,104,255,.35); }
.sugs { display: flex; gap: 8px; flex-wrap: wrap; }
.sug { border: 1px solid var(--a-line); background: rgba(255,255,255,.8); color: var(--a-ink-2); border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 500; text-align: left; transition: all .2s; }
.sug:hover { background: #fff; color: var(--a-ink); border-color: #A9B4FF; box-shadow: 0 6px 16px rgba(84,104,255,.15); }
.sug .ad { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }

.kstrip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kstrip > div { border-radius: 20px; padding: 14px 16px; background: var(--glass); border: 1px solid rgba(255,255,255,.8); box-shadow: var(--sh); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.kstrip span { font-size: 12px; color: var(--a-muted); font-weight: 600; }
.kstrip b { display: block; font-family: var(--f-display); font-size: 25px; margin-top: 2px; font-variant-numeric: tabular-nums; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.kstrip small { font-size: 11.5px; color: var(--a-muted); }
.kstrip small.up { color: var(--a-ok); } .kstrip small.down { color: var(--a-bad); }
.finds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.find { border-radius: 22px; padding: 12px 14px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; text-align: left; color: var(--a-ink); background: var(--glass); border: 1px solid rgba(255,255,255,.8); box-shadow: var(--sh); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .2s, box-shadow .2s; }
.find:hover { transform: translateY(-3px); box-shadow: 0 18px 36px color-mix(in srgb, var(--ac) 25%, transparent); }
.find .mascot { grid-row: span 2; margin: -10px 0 -8px -4px; }
.find .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--a-muted); }
.find .who b { color: var(--a-ink); font-family: var(--f-display); font-size: 14px; }
.find p { margin: 0; font-size: 13.5px; line-height: 1.4; color: var(--a-ink-2); }
.sev { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; margin-left: auto; }
.sev.crit { background: #FFE4EA; color: var(--a-bad); }
.sev.warn { background: #FFF1D9; color: var(--a-warn); }
.sev.good { background: #DDF7E7; color: var(--a-ok); }
.sev.info { background: #E3EEFF; color: #3559E0; }

/* Página de agente */
.ag-hero { position: relative; overflow: hidden; border-radius: 30px; padding: 22px 26px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 26px; align-items: center; background: radial-gradient(50% 120% at 0% 50%, color-mix(in srgb, var(--ac) 26%, transparent), transparent 70%), radial-gradient(40% 80% at 100% 0%, color-mix(in srgb, var(--ac) 14%, transparent), transparent 70%), rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.85); box-shadow: var(--sh); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.ag-hero .mascot { grid-row: span 2; filter: drop-shadow(0 16px 24px color-mix(in srgb, var(--ac) 35%, transparent)); }
.ag-role { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--ac); }
.ag-name { font-size: clamp(34px, 4vw, 52px); font-weight: 800; letter-spacing: -.03em; line-height: 1; margin: 4px 0 6px; background: linear-gradient(110deg, var(--ac), color-mix(in srgb, var(--ac) 50%, #5468FF)); -webkit-background-clip: text; background-clip: text; color: transparent; width: fit-content; }
.ag-tag { margin: 0; font-size: 16px; color: var(--a-ink-2); max-width: 56ch; }
.ag-live { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--a-ink-2); background: #fff; border: 1px solid var(--a-line); padding: 6px 12px; border-radius: 999px; margin-top: 10px; }
.ag-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); animation: blink 1.6s infinite; }
.pipe { grid-column: 2; display: flex; gap: 0; flex-wrap: wrap; margin-top: 6px; }
.pstep { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--a-ink-2); background: rgba(255,255,255,.8); border: 1px solid var(--a-line); padding: 7px 12px 7px 8px; border-radius: 999px; }
.pstep .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; background: var(--ac); flex: none; }
.pipe .arr { align-self: center; width: 22px; height: 2px; background: linear-gradient(90deg, var(--ac), transparent); margin: 0 2px; }
.chips { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.chips .lbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--a-muted); font-weight: 700; margin-right: 4px; }
.chips span.c { font-size: 12px; color: var(--a-ink-2); background: color-mix(in srgb, var(--ac) 9%, #fff); border: 1px solid color-mix(in srgb, var(--ac) 25%, transparent); border-radius: 999px; padding: 4px 10px; font-family: var(--f-mono); }
.work { display: grid; grid-template-columns: minmax(0, .88fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
.chat { border-radius: 26px; display: flex; flex-direction: column; min-height: 460px; max-height: 720px; background: var(--glass); border: 1px solid rgba(255,255,255,.8); box-shadow: var(--sh); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); overflow: hidden; }
.chat-h { padding: 10px 14px; border-bottom: 1px solid var(--a-line); font-size: 13px; font-weight: 600; color: var(--a-ink-2); display: flex; gap: 8px; align-items: center; }
.msgs { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; font-size: 14px; line-height: 1.5; }
.msg.me { align-self: flex-end; background: var(--grad); color: #fff; padding: 9px 14px; border-radius: 18px 18px 4px 18px; box-shadow: 0 8px 20px rgba(84,104,255,.25); }
.msg.bot { align-self: flex-start; display: flex; gap: 8px; align-items: flex-end; }
.msg.bot .bub { background: #fff; border: 1px solid var(--a-line); padding: 10px 14px; border-radius: 18px 18px 18px 4px; color: var(--a-ink); box-shadow: 0 6px 16px rgba(70,80,170,.07); }
.msg.bot .bub b { color: var(--a-ink); }
.msg.bot .bub .hl { color: var(--ac, #5468FF); font-weight: 700; }
.msg.bot .bub ul { margin: 6px 0 0; padding-left: 18px; }
.msg.bot .bub li { margin: 3px 0; }
.thinking { display: grid; gap: 4px; font-family: var(--f-mono); font-size: 11.5px; color: var(--a-muted); }
.thinking p { margin: 0; display: flex; gap: 8px; align-items: center; }
.thinking p::before { content: ''; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #D5DAF5; border-top-color: var(--ac, #5468FF); animation: spin .8s linear infinite; flex: none; }
.thinking p.ok::before { animation: none; border-color: var(--a-ok); background: var(--a-ok); }
.chat-sugs { padding: 10px 12px; border-top: 1px solid var(--a-line); display: flex; gap: 6px; flex-wrap: wrap; }
.chat-in { display: flex; gap: 8px; padding: 0 12px 12px; }
.chat-in input { flex: 1; min-width: 0; background: #fff; border: 1px solid var(--a-line); color: var(--a-ink); border-radius: 14px; padding: 10px 13px; font-size: 13.5px; }
.chat-in button { border: 0; border-radius: 14px; padding: 0 15px; font-weight: 700; background: var(--ac, #5468FF); color: #fff; }
.evid { border-radius: 26px; padding: 18px; min-width: 0; display: grid; gap: 14px; align-content: start; min-height: 460px; background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.9); box-shadow: var(--sh); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.evid-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.evid-h h3 { font-size: 17px; font-weight: 700; }
.evid-h .tag2 { font-size: 11px; color: var(--a-muted); border: 1px solid var(--a-line); border-radius: 999px; padding: 3px 9px; font-family: var(--f-mono); }
.evid .note { font-size: 12px; color: var(--a-muted); }
.fade-in { animation: fin .45s ease both; }
@keyframes fin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Gráficos (tema claro) */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--f-body); font-size: 11px; fill: var(--a-muted); }
.chart .val { fill: var(--a-ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--ch-grid); stroke-width: 1; }
.chart .hit { fill: transparent; }
.chart .mk:hover { filter: brightness(1.12) saturate(1.1); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--a-ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
.legend i.line { height: 3px; width: 16px; border-radius: 2px; }
.legend i.dash { height: 0; width: 16px; border-top: 2px dashed; border-radius: 0; background: none !important; }
.tip { position: fixed; z-index: 400; pointer-events: none; background: #121637; color: #F1F3FF; border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.4; box-shadow: 0 10px 24px rgba(20,25,70,.3); max-width: 260px; opacity: 0; transition: opacity .12s; }
.tip.on { opacity: 1; }
.tip b { font-family: var(--f-display); }
.dtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.dtable th { text-align: left; font-weight: 700; color: var(--a-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 8px; border-bottom: 1px solid var(--a-line); white-space: nowrap; }
.dtable td { padding: 9px 8px; border-bottom: 1px solid rgba(112,124,214,.12); color: var(--a-ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dtable td.r, .dtable th.r { text-align: right; }
.dtable td b { color: var(--a-ink); }
.dtable tr:hover td { background: rgba(84,104,255,.04); }
.dt-wrap { overflow-x: auto; }
.pillv { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
.pillv.good { background: #DDF7E7; color: var(--a-ok); }
.pillv.warn { background: #FFF1D9; color: var(--a-warn); }
.pillv.bad { background: #FFE4EA; color: var(--a-bad); }
.pillv.info { background: #E3EEFF; color: #3559E0; }
.journey { display: grid; position: relative; }
.jstep { display: grid; grid-template-columns: 64px 32px minmax(0, 1fr); gap: 10px; align-items: start; padding-bottom: 14px; position: relative; }
.jstep .when { font-family: var(--f-mono); font-size: 11px; color: var(--a-muted); text-align: right; padding-top: 7px; }
.jstep .dot { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px solid color-mix(in srgb, var(--ac) 60%, #fff); color: var(--ac); z-index: 1; box-shadow: 0 4px 10px rgba(70,80,170,.1); }
.jstep .dot svg { width: 15px; height: 15px; }
.jstep:not(:last-child)::before { content: ''; position: absolute; left: 89px; top: 32px; bottom: 0; width: 2px; background: linear-gradient(var(--ac), transparent); opacity: .5; }
.jstep .what b { display: block; font-size: 13.5px; color: var(--a-ink); }
.jstep .what span { font-size: 12.5px; color: var(--a-muted); }
.heat { border-collapse: separate; border-spacing: 4px; width: 100%; font-size: 12.5px; }
.heat th { font-weight: 700; color: var(--a-muted); font-size: 11px; padding: 4px; text-align: center; }
.heat th.rh { text-align: left; color: var(--a-ink-2); white-space: nowrap; }
.heat td { text-align: center; border-radius: 9px; padding: 9px 4px; font-variant-numeric: tabular-nums; font-weight: 700; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.adcard { border-radius: 18px; padding: 12px; background: #fff; border: 1px solid var(--a-line); display: grid; gap: 8px; }
.adcard .lbl { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
.adcard .mock { border-radius: 14px; padding: 16px; background: linear-gradient(135deg, #00BCEB, #5468FF 60%, #A855F7); color: #fff; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.25; min-height: 100px; display: flex; align-items: flex-end; }
.adcard.bad .mock { background: linear-gradient(135deg, #FB7185, #E11D48); }
.adcard p { margin: 0; font-size: 12.5px; color: var(--a-muted); }
.answer-card { border-radius: 20px; background: rgba(255,255,255,.85); border: 1px solid var(--a-line); padding: 14px; display: grid; gap: 12px; }
.arm .log { font-family: var(--f-mono); font-size: 11.5px; line-height: 1.7; color: var(--a-ink-2); background: #F6F8FF; border: 1px solid var(--a-line); border-radius: 14px; padding: 10px 12px; }
.arm .log p { margin: 0; }
.arm .log .t { color: #9AA2C8; } .arm .log .ok { color: var(--a-ok); } .arm .log .ai { color: #5468FF; } .arm .log .warn { color: var(--a-warn); }
.arm .track { background: #F6F8FF; color: var(--a-ink-2); border: 1px solid var(--a-line); border-radius: 18px; padding: 14px 16px; font-family: var(--f-mono); font-size: 11.5px; line-height: 1.7; min-width: 0; }
.arm .track h4 { font-family: var(--f-body); color: var(--a-ink); font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.arm .track .k { color: var(--a-muted); } .arm .track .v { color: #5468FF; word-break: break-all; font-weight: 500; }
.arm .track .ev { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--a-line); }
.arm .track .ev p { margin: 2px 0; }
.arm .track .ok { color: var(--a-ok); }

/* Cómo funciona */
.arch { display: grid; gap: 16px; }
.arch h3 { font-size: 16px; color: var(--a-ink-2); }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
.flow-col { border-radius: 22px; padding: 14px; display: grid; gap: 8px; align-content: start; position: relative; background: var(--glass); border: 1px solid rgba(255,255,255,.8); box-shadow: var(--sh); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.flow-col h4 { font-family: var(--f-body); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--a-muted); }
.flow-col:not(:last-child)::after { content: ''; position: absolute; right: -16px; top: 50%; width: 16px; height: 2px; background: var(--grad); z-index: 2; }
.node { background: #fff; border: 1px solid var(--a-line); border-radius: 12px; padding: 8px 10px; font-size: 13px; color: var(--a-ink); font-weight: 600; }
.node small { display: block; color: var(--a-muted); font-size: 11px; font-family: var(--f-mono); font-weight: 400; }
.node.ac { border-color: color-mix(in srgb, var(--ac) 50%, transparent); background: color-mix(in srgb, var(--ac) 8%, #fff); }

/* Mascotas */
.mascot { display: block; overflow: visible; }
.mascot .m-bob { animation: m-bob 3.2s ease-in-out infinite; }
.mascot .m-shadow { transform-box: fill-box; transform-origin: center; animation: m-shadow 3.2s ease-in-out infinite; }
.mascot .m-eye { transform-box: fill-box; transform-origin: center; animation: m-blink 4.6s infinite; }
.mascot .m-ant { animation: m-glow 1.8s ease-in-out infinite; }
.mascot .m-arm-r { transform-box: fill-box; transform-origin: 50% 8%; }
.mascot.wave .m-arm-r, .anode:hover .m-arm-r, .find:hover .m-arm-r { animation: m-wave 1.1s ease-in-out infinite; }
.mascot .m-liq { animation: m-liq 2.4s ease-in-out infinite; }
.mascot .m-screen-blink { animation: m-glow 2.2s ease-in-out infinite; }
@keyframes m-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes m-shadow { 0%, 100% { transform: scaleX(1); opacity: .9; } 50% { transform: scaleX(.8); opacity: .55; } }
@keyframes m-blink { 0%, 91%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
@keyframes m-glow { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@keyframes m-wave { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-28deg); } }
@keyframes m-liq { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2.5px); } }

/* Acceso al ARM desde la plataforma actual */
